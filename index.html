    <style>
        :root { --bg:#0b0b0d; --gold:#d4a017; --text:#f5f5f5; --muted:#a3a3a3; }

        body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
        .card { max-width:460px; width:100%; text-align:center; background:#151518; border:1px solid #2a2a2e; border-radius:20px; padding:2rem 1.5rem; box-shadow:0 10px 40px rgba(0,0,0,.5); }

        h1 { font-size:1.5rem; font-weight:900; color:var(--gold); margin-bottom:.75rem; }
        p { line-height:1.9; color:var(--text); font-weight:700; }
        .by { margin-top:1rem; color:var(--muted); font-size:.9rem; font-weight:600; }
        .dots { display:flex; gap:6px; justify-content:center; margin-top:1.25rem; }
        .dots span { width:9px; height:9px; border-radius:50%; background:var(--gold); animation:b 1.2s infinite ease-in-out; }
        .dots span:nth-child(2) { animation-delay:.2s; } .dots span:nth-child(3) { animation-delay:.4s; }
        @keyframes b { 0%,80%,100% { opacity:.2; transform:scale(.8); } 40% { opacity:1; transform:scale(1.1); } }
